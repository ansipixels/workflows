name: go-checks

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # pin@v4
      - name: Setup Go environment
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # pin@v5
        with:
          go-version: '1.24'
          check-latest: true
      - name: Run Vulncheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Download linter config
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Use the branch from the PR or the current branch, fallback to main
          BRANCH="${{ github.head_ref || github.ref_name }}"
          curl -fsS -o .golangci.yml "https://raw.githubusercontent.com/ansipixels/workflows/${BRANCH}/golangci.yml" || \
          curl -fsS -o .golangci.yml https://raw.githubusercontent.com/ansipixels/workflows/main/golangci.yml
      - name: Run golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # pin@v8
        with:
          version: v2.6.1
      - name: Run tests
        run: |
          go version
          go run . buildinfo || true # to also confirm go toolchain version used
          if make -n test &>/dev/null; then
            echo "Running tests with make test"
            make test
          else
            echo "No Makefile test target, running tests with race detection as default behavior"
            go test -race ./...
          fi
        shell: bash # to use bash on Windows
